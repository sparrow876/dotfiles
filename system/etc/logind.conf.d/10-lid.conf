# Laptop lid (installed to /etc/systemd/logind.conf.d/, see ROOT-STEPS.md §14)
#   on battery:            suspend (the lock screen comes up first)
#   plugged in:            lock only, the laptop keeps running (downloads etc.)
#   external monitor:      nothing (keep working on the big screen)
# Hyprland turns the laptop panel off/on with the lid itself (keybinds.lua).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
