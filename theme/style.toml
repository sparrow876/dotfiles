# Shared look for every theme: fonts, sizes, shape. Colors live in
# theme/palettes/<name>.toml; the active theme's name is in theme/current.
# After editing: theme/render.sh  (or theme/apply.sh <name> to also reload apps)

[style]
glass_alpha = "0.75"     # frosted surfaces
rounding    = "14"
gaps_in     = "6"
gaps_out    = "12"
border_size = "2"
font_ui     = "JetBrainsMono Nerd Font"
font_cjk    = "Noto Sans CJK JP"

# Text sizes, matched to Windows at 125% scaling on a 1080p laptop
# (Segoe UI 9pt x 1.25 = 15px). The screen itself stays at 1x.
font_px      = "15"      # Quickshell + rofi body text (pixels)
font_px_small = "13"     # secondary text, tooltips
font_pt      = "11.25"   # rofi (points; 11.25pt = 15px at 96 dpi). GTK/Qt sizes are set in install.sh / theme/qt.sh
