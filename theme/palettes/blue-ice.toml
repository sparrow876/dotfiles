# Blue Ice — the original dark/light blue + white
# Role names are the same for every theme (see theme/README.md).

[meta]
name = "Blue Ice"

[colors]
base      = "#0d1b2a"   # deepest background
surface   = "#1b263b"   # bar, panels, popups, rofi, kitty bg
overlay   = "#2b3a55"   # cards, hover, inactive borders
blue      = "#415a77"   # secondary / dim accent (terminal "bright black")
lightblue = "#7fb3ff"   # primary accent, active states
ice       = "#cfe8ff"   # highlights, graphs
text      = "#f4f8ff"   # main text
muted     = "#9fb3c8"   # secondary text
warn      = "#f2c66d"   # battery < 20%, high temps
critical  = "#ef6f7a"   # battery < 10%, recording dot
green     = "#93d8b4"   # terminal ANSI green
magenta   = "#b9a7ff"   # terminal ANSI magenta
cyan      = "#7fd6e8"   # terminal ANSI cyan
