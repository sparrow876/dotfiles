# Catppuccin Mocha — official palette (github.com/catppuccin/palette); crust/base/surface0/surface2/blue/lavender/text/subtext0/yellow/red/green/mauve/teal
# Role names are the same for every theme (see theme/README.md).

[meta]
name = "Catppuccin Mocha"

[colors]
base      = "#11111b"   # deepest background
surface   = "#1e1e2e"   # bar, panels, popups, rofi, kitty bg
overlay   = "#313244"   # cards, hover, inactive borders
blue      = "#585b70"   # secondary / dim accent (terminal "bright black")
lightblue = "#89b4fa"   # primary accent, active states
ice       = "#b4befe"   # highlights, graphs
text      = "#cdd6f4"   # main text
muted     = "#a6adc8"   # secondary text
warn      = "#f9e2af"   # battery < 20%, high temps
critical  = "#f38ba8"   # battery < 10%, recording dot
green     = "#a6e3a1"   # terminal ANSI green
magenta   = "#cba6f7"   # terminal ANSI magenta
cyan      = "#94e2d5"   # terminal ANSI cyan
