# kitty terminal. Colors come from colors.conf (generated by theme/render.sh).

# --- Font --------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
font_size        13.0
disable_ligatures never

# --- Look --------------------------------------------------------------------
# Translucent background; Hyprland blurs what's behind it (frosted glass).
background_opacity 0.80
# Neovim switches this window to fully opaque while it runs (remote control below).
dynamic_background_opacity yes
window_padding_width 12
hide_window_decorations yes
cursor_shape beam
tab_bar_style powerline
tab_bar_edge bottom

include colors.conf

# --- Behavior ----------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0
confirm_os_window_close 0
update_check_interval 0
copy_on_select no
strip_trailing_spaces smart
scrollback_lines 10000
shell_integration enabled

# --- Remote control (only via kitty's own socket, used by Neovim for opacity) --
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
