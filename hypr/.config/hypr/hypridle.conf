# hypridle: what happens when you leave the laptop alone.
#   4 min  dim to 30% of the current brightness + the idle screen (clock)
#   5 min  lock (qylock, scripts/lock.sh)
#   6 min  screen off
#  20 min  suspend, ONLY on battery (never when plugged in)
# Any input undoes dim / idle screen / screen off.
# Nothing here fires while: the coffee-cup idle inhibitor is on (bar / ALT + I),
# something is fullscreen (video, game: Hyprland idle_inhibit rule), or an app
# such as Teams/Discord/a browser call asks the system to stay awake (D-Bus /
# systemd inhibitors are respected: the ignore_* options stay false).
# This file uses hypridle's own format (not Lua).

general {
    lock_cmd = ~/dotfiles/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session          # lock before suspend (also lid close)
    # Hold suspend until the lock screen is really up (Hyprland reports the
    # session locked), so the desktop is never visible on resume. The default
    # (2) only does this for hyprlock; qylock is a Quickshell session lock.
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 240
    on-timeout = ~/dotfiles/scripts/idle-dim.sh dim
    on-resume = ~/dotfiles/scripts/idle-dim.sh restore
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1200
    # Only on battery (battery "Discharging"; charging over the barrel jack or
    # USB-C never suspends). Keeps checking while idle, so unplugging later
    # still suspends.
    on-timeout = ~/dotfiles/scripts/idle-suspend.sh start
    on-resume = ~/dotfiles/scripts/idle-suspend.sh stop
}
