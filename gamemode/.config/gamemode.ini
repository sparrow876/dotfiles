; GameMode: used through Steam launch options `... gamemoderun ... %command%`
; (system/GAMING.md). While a game runs: CPU governor -> performance, the game
; gets a higher CPU priority, and the screen never idles/locks.
; Needs you in the "gamemode" group (system/ROOT-STEPS.md section 13), or it
; can't raise the priority and asks for a password to change the governor.
; Check it's active while a game runs:  gamemoded -s
; All options: https://github.com/FeralInteractive/gamemode/blob/master/example/gamemode.ini

[general]
; nice -10 for the game (the gamemode group may go down to -10)
renice=10
; keep the screen awake (hypridle respects this D-Bus inhibitor)
inhibit_screensaver=1
