# zathura glass OFF: the solid Nord backgrounds (nord0 #2E3440, nord1 #3B4252).
# zathurarc loads these first, then glass.conf (the Ctrl+G choice) on top.
# Keep "glass OFF" in the first line: hypr/conf/rules.lua reads it.
# One `set` per line, no trailing comments: zathura-glass sends each line to
# open windows as is.
set default-bg              "#2E3440"
set statusbar-bg            "#3B4252"
set inputbar-bg             "#2E3440"
set completion-bg           "#3B4252"
set completion-group-bg     "#2E3440"
set index-bg                "#2E3440"
set render-loading-bg       "#2E3440"
set recolor-lightcolor      "#2E3440"
