# zathura glass ON: the whole window is slightly see-through, text included:
# Hyprland draws it at 90% (rule "zathura-glass" in hypr/conf/rules.lua) and
# blurs what's behind, like kitty. On top of that the backgrounds here are a
# little transparent themselves, so around the pages it ends up ~81%.
# Toggle: Ctrl+G (bin/.local/bin/zathura-glass). Keep "glass ON"/"glass OFF"
# in the first line: rules.lua reads it. One `set` per line, no trailing
# comments: zathura-glass sends each line to open windows as is.
set default-bg              "rgba(46,52,64,0.90)"
set statusbar-bg            "rgba(59,66,82,0.94)"
set inputbar-bg             "rgba(46,52,64,0.94)"
set completion-bg           "rgba(59,66,82,0.97)"
set completion-group-bg     "rgba(46,52,64,0.97)"
set index-bg                "rgba(46,52,64,0.94)"
set render-loading-bg       "rgba(46,52,64,0.90)"
set recolor-lightcolor      "rgba(46,52,64,0.95)"
