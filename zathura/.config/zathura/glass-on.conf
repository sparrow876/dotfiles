# zathura glass ON: slightly see-through backgrounds (Hyprland blurs what's
# behind, like kitty). Pages stay solid in normal mode; in dark mode (Ctrl+R)
# the page background is very slightly see-through too, text stays solid.
# Toggle: Ctrl+G (bin/.local/bin/zathura-glass). One `set` per line, no
# trailing comments: zathura-glass sends each line to open windows as is.
set default-bg              "rgba(46,52,64,0.82)"
set statusbar-bg            "rgba(59,66,82,0.86)"
set inputbar-bg             "rgba(46,52,64,0.86)"
set completion-bg           "rgba(59,66,82,0.92)"
set completion-group-bg     "rgba(46,52,64,0.92)"
set index-bg                "rgba(46,52,64,0.86)"
set render-loading-bg       "rgba(46,52,64,0.82)"
set recolor-lightcolor      "rgba(46,52,64,0.90)"
