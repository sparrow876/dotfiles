# mpdris2-rs: shows MPD in the bar's music widget + media keys (MPRIS).
# Replaced mpd-mpris (2026-11-22): mpd-mpris re-fetched each song's embedded
# cover in MPD's default 8 KB chunks (a 5 MB cover = 637 round trips, 7.5 s)
# and stopped reporting track changes meanwhile; mpdris2-rs raises the chunk
# size (binarylimit) and works asynchronously.
[Service]
# MPD listens on IPv4 only ("localhost" resolves to ::1 first); no desktop
# notification on every song change
ExecStart=
ExecStart=/usr/bin/mpdris2-rs --host 127.0.0.1:6600 --no-notification
# Both this and mpd.service use $XDG_RUNTIME_DIR/mpd (covers here, MPD's
# socket there): keep the folder when this one restarts
RuntimeDirectoryPreserve=yes
