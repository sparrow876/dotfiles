# Environment for apps started by systemd / D-Bus (not launched from Hyprland),
# e.g. Nautilus when another app asks to "open folder". Read at login.
# Keep in sync with hypr/.config/hypr/conf/env.lua.

# GTK4: OpenGL renderer, so starting an app doesn't wake the RTX 3050 (~1.6 s)
GSK_RENDERER=ngl
