# MPD: the music server rmpc talks to (runs as your user: systemd --user,
# see system/ROOT-STEPS.md "Music: MPD + rmpc"). Reference: man mpd.conf
# Music is read from ~/Music; MPD's own files live under ~/.local.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
sticker_file        "~/.local/share/mpd/sticker.sql"
state_file          "~/.local/state/mpd/state"
log_file            "syslog"          # journalctl --user -u mpd

# Only reachable from this computer: TCP on localhost (rmpc, mpdris2-rs for the
# bar / media keys) and the usual local socket that GUI clients look for
# (many GUI clients try $XDG_RUNTIME_DIR/mpd/socket first)
bind_to_address     "127.0.0.1"
bind_to_address     "$XDG_RUNTIME_DIR/mpd/socket"
port                "6600"

auto_update         "yes"             # notice new files in ~/Music by itself
restore_paused      "yes"             # don't start playing at login
replaygain          "auto"

audio_output {
    type            "pipewire"
    name            "PipeWire"
}
