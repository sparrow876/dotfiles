# Your own makepkg settings (AUR builds with yay / makepkg), read after
# /etc/makepkg.conf. Only overrides what's listed here.

# No "-debug" packages: Arch's default OPTIONS contain `debug`, which makes
# every AUR build also produce a <name>-debug package (debug symbols) that yay
# then installs. Turns `debug` into `!debug`, leaves every other option as is.
OPTIONS=("${OPTIONS[@]/#debug/!debug}")
