# GENERATED by theme/render.sh from theme/palette.toml (template:
# theme/templates/starship/.config/starship.toml.tmpl). Edit the template.
#
# One line: directory, git branch + status, command duration (> 2s), prompt symbol
# (red after a failed command).
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #7fb3ff"
read_only = " 󰌾"
read_only_style = "#f2c66d"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "#cfe8ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "#9fb3c8"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
style = "#f2c66d"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold #7fb3ff)"
error_symbol = "[❯](bold #ef6f7a)"
vimcmd_symbol = "[❮](bold #cfe8ff)"
